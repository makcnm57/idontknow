<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>ScreenDraw — Barre d'outils</title>
    <link rel="stylesheet" href="./toolbar.css" />
  </head>
  <body>
    <div class="toolbar" role="toolbar" aria-label="ScreenDraw">
      <div class="drag-handle" title="Déplacer la barre" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <button
        id="mode-toggle"
        class="mode-toggle"
        type="button"
        title="Basculer dessin / passif (Ctrl+Shift+F)"
      >
        <span class="mode-dot" aria-hidden="true"></span>
        <span id="mode-label">Passif</span>
      </button>
      <button id="hide" class="icon-button" type="button" title="Masquer (Ctrl+Shift+D)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
