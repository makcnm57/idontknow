<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>ScreenDraw — Barre d'outils</title>
    <link rel="stylesheet" href="./toolbar.css" />
  </head>
  <body>
    <div class="toolbar" role="toolbar" aria-label="ScreenDraw">
      <div class="drag-handle" title="Déplacer la barre" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <div class="group" role="group" aria-label="Outils">
        <button
          class="icon-button"
          type="button"
          data-tool="select"
          title="Sélection (V) — glisser pour déplacer, Suppr pour supprimer"
          aria-label="Sélection"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3l12 9-5 1.5L10 19z" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="pen"
          title="Stylo (P)"
          aria-label="Stylo"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" />
            <path d="M14 7l3 3" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="highlighter"
          title="Surligneur (H)"
          aria-label="Surligneur"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 4l5 5-8 8H7v-5l8-8z" />
            <path d="M7 17l-3 3h6" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="text"
          title="Texte (T) — Entrée valide, Maj+Entrée : nouvelle ligne"
          aria-label="Texte"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7V5h14v2" />
            <path d="M12 5v14" />
            <path d="M9 19h6" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="number"
          title="Numérotation (N) — pastilles 1, 2, 3…"
          aria-label="Numérotation"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M10.5 9.5L12.5 8v8" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="eraser"
          title="Gomme (E)"
          aria-label="Gomme"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 20l-4-4L14 6l6 6-8 8H8z" />
            <path d="M9 11l6 6" />
            <path d="M12 20h8" />
          </svg>
        </button>
      </div>

      <span class="divider" aria-hidden="true"></span>

      <div class="group" role="group" aria-label="Formes">
        <button
          class="icon-button"
          type="button"
          data-tool="line"
          title="Ligne (L) — Maj : 45°"
          aria-label="Ligne"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19L19 5" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="arrow"
          title="Flèche (A) — Maj : 45°"
          aria-label="Flèche"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19L19 5" />
            <path d="M10 5h9v9" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="rect"
          title="Rectangle (R) — Maj : carré"
          aria-label="Rectangle"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="6" width="16" height="12" rx="1" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="ellipse"
          title="Ellipse (O) — Maj : cercle"
          aria-label="Ellipse"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="12" rx="8" ry="6" />
          </svg>
        </button>
        <button
          id="fill-toggle"
          class="icon-button"
          type="button"
          title="Rectangles et ellipses : plein ou contour"
          aria-label="Formes pleines"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect class="fill-icon" x="5" y="5" width="14" height="14" rx="2" />
          </svg>
        </button>
      </div>

      <span class="divider" aria-hidden="true"></span>

      <div id="presentation" class="group" role="group" aria-label="Présentation">
        <button
          class="icon-button"
          type="button"
          data-board="white"
          title="Tableau blanc (W) — Échap pour revenir à l'écran"
          aria-label="Tableau blanc"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="12" rx="1.5" />
            <path d="M9 21l3-4 3 4" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-board="black"
          title="Tableau noir (B) — Échap pour revenir à l'écran"
          aria-label="Tableau noir"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect class="board-black-icon" x="3" y="5" width="18" height="12" rx="1.5" />
            <path d="M9 21l3-4 3 4" />
          </svg>
        </button>
        <button
          class="icon-button"
          type="button"
          data-tool="laser"
          title="Pointeur laser (K) — s'efface tout seul"
          aria-label="Pointeur laser"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"
            />
          </svg>
        </button>
      </div>

      <span class="divider" aria-hidden="true"></span>

      <div id="colors" class="group colors" role="group" aria-label="Couleurs">
        <label id="custom-swatch" class="swatch custom" title="Couleur personnalisée">
          <input id="custom-color" type="color" aria-label="Couleur personnalisée" />
        </label>
      </div>

      <span class="divider" aria-hidden="true"></span>

      <div id="sizes" class="group" role="group" aria-label="Épaisseur"></div>

      <span class="divider" aria-hidden="true"></span>

      <div class="group" role="group" aria-label="Historique">
        <button
          id="undo"
          class="icon-button"
          type="button"
          title="Annuler (Ctrl+Z)"
          aria-label="Annuler"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14L4 9l5-5" />
            <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
          </svg>
        </button>
        <button
          id="redo"
          class="icon-button"
          type="button"
          title="Rétablir (Ctrl+Y)"
          aria-label="Rétablir"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 14l5-5-5-5" />
            <path d="M20 9H10a6 6 0 0 0 0 12h3" />
          </svg>
        </button>
        <button
          id="clear"
          class="icon-button"
          type="button"
          title="Tout effacer (Suppr)"
          aria-label="Tout effacer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M9 7V4h6v3" />
            <path d="M6 7l1 13h10l1-13" />
            <path d="M10 11v5M14 11v5" />
          </svg>
        </button>
      </div>

      <span class="divider" aria-hidden="true"></span>

      <button
        id="mode-toggle"
        class="mode-toggle"
        type="button"
        title="Basculer dessin / passif (Ctrl+Shift+F)"
      >
        <span class="mode-dot" aria-hidden="true"></span>
        <span id="mode-label">Passif</span>
      </button>
      <button
        id="hide"
        class="icon-button"
        type="button"
        title="Masquer (Ctrl+Shift+D)"
        aria-label="Masquer"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
